<script src="{{ '/scripts/cookies.js' | relative_url }}"></script>

<div id="cookie-banner" class="cookie-banner"
    role="region" aria-labelledby="cookie-label" aria-describedby="cookie-desc">

    <!-- Title -->
    <h4 data-i18n="$common.cookies.title">Privacy & Analytics</h4>

    <!-- Description -->
    <div id="cookie-desc">
        <p data-i18n-html="$common.cookies.desc"></p>
    </div>

    <!-- Buttons -->
    <div class="cookie-buttons">
        <button class="outline" onclick="updateConsent('denied')"  data-i18n="$common.cookies.decline"></button>
        <button class="btn"     onclick="updateConsent('granted')" data-i18n="$common.cookies.accept"> </button>
    </div>
</div>
