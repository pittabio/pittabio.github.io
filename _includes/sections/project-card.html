{% assign p = include.project %}
<article class="card">
    <!-- Title link -->
    <a class="mini-title" href="{{ p.page }}" target="_blank" data-i18n="{{ p.name }}"></a>
    <!-- Image -->
    {% if p.image %}
        <img src="{{ p.image }}" alt="The banner image for the game {{ p.name }}" onclick="openPopup(this)"/>
    {% endif %}
    <!-- Description -->
    <p class="project-desc" data-i18n-html="{{ p.desc }}"></p>
    <!-- Buttons -->
    <div class="flexbox">

        <!-- first link -->
        <a class="btn full left" href="{{ p.dl }}" target="_blank">
            <span>{{ p.dl_name }}</span>
            <span class="{{ p.dl_icon }}"></span>
        </a>

        <!-- second link -->
        {% if p.dl2 and p.dl2_name and p.dl2_icon %}
            <a class="btn full" href="{{ p.dl2 }}" target="_blank">
                <span>{{ p.dl2_name }}</span>
                <span class="{{ p.dl2_icon }}"></span>
            </a>
        {% endif %}

        <!-- third link -->
        <a class="btn full right" href="{{ p.page }}" target="_blank">
            <span data-i18n="card.details"></span>
            <span class="arrow-svg"></span>
        </a>

    </div><!-- /buttons/ -->
</article><!-- /card/ -->
