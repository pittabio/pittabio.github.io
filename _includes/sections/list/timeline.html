{% for item in include.items %}
    {% assign key = include.prefix | append: "." | append: item.id %}

    <div class="tl-item">
        <!-- Date -->
        <span class="tag" data-i18n="{{ key }}.date"></span>

        <!-- Role -->
        <h4 data-i18n="{{ key }}.role"></h4>

        <!-- Institution -->
        <em data-i18n="{{ key }}.institution"></em>

        <!-- url + url_text -->
        {% if item.url %}
            <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer"
               class="tag" data-i18n="{{ item.url_text }}"></a>
        {% endif %}

        <!-- Details -->
        <ul>
            {% for i in (1..item.details) %}
                <li data-i18n-html="{{ key }}.details.{{ i }}"></li>
            {% endfor %}
        </ul>

    </div>
{% endfor %}
