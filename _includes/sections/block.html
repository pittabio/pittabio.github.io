{% comment %}
To include:
- tag
- title
- paragraph
Optional:
- url
- btn_text
{% endcomment %}

<!-- Tag -->
<span class="tag" data-i18n="{{ include.tag }}"></span>

<!-- Title -->
<h1 class="title" data-i18n-html="{{ include.title }}">{{ include.title }}</h1>

<!-- The paragraph of the block -->
<p data-i18n-html={{ include.paragraph }}></p>

<!-- If the url is imported, then it's a button -->
{% if include.url %}
    <br><!-- break -->

    <a class="btn big" href="{{ include.url }}" target="_blank">
        <span data-i18n="{{ include.btn_text }}"></span>
        <span class="arrow-svg"></span>
    </a>
{% endif %}
