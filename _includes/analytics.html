<!-- Default Consent Setting (Advanced Consent Mode) -->
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // 1. Define the default state as 'denied'
    if (localStorage.getItem('consentMode') === null) {
        gtag('consent', 'default', {
            'ad_storage': 'denied',
            'analytics_storage': 'denied',
            'personalization_storage': 'denied',
            'ad_user_data': 'denied',
            'ad_signals': 'denied',
            'wait_for_update': 500 // Wait half a second to see if the user accepts
        });
    } else {
        // If the user has already chosen previously, load their choice
        gtag('consent', 'default', JSON.parse(localStorage.getItem('consentMode')));
    }
</script>
