---
layout: default
title: Home
i18n_title: head_title
description: The home page
---

<!-- # HERO SECTION # -->
<section id="hero" class="cont hero">
    <!-- LEFT -->
    <div class="desc">
        <!-- Text: tag, header and presentation -->
        <span class="tag" data-i18n="hero.tag"></span>
        <h1 class="title">Fabio Pittaccio</h1>
        <p data-i18n-html="hero.presentation"></p>

        <br><!-- break -->

        <!-- View Projects Button -->
        <a class="btn big" href="projects.html" target="_blank">
            <span data-i18n="hero.cta"></span>
            <span class="arrow-svg"></span>
        </a>

        <!-- Quick info -->
        <div class="info-box">
            <div class="info">
                <b class="mini-title">5+</b>
                <p data-i18n="hero.info.published"></p>
            </div>
            <div class="info">
                <b class="mini-title">UE5</b>
                <p data-i18n="hero.info.engine"></p>
            </div>
            <div class="info">
                <b class="mini-title">PC · Android</b>
                <p data-i18n="hero.info.platforms"></p>
            </div>
        </div><!-- /hero-info-box/ -->
    </div><!-- /hero-content/ -->

    <!-- RIGHT (Image) -->
    <img src="/media/profile.jpg" alt="Fabio Pittaccio"
         onclick="openOneImage(this)"

         data-img1="/media/profile.jpg"
         data-desc1="hero.image_desc"
    />

    <!-- INDICATOR -->
    <div style="position: absolute; left: 50%; bottom: 1.5rem;">
        <a href="#about" data-i18n-aria="indicator.ARIA" aria-label="">
            <span class="arrow-circle-svg"></span>
        </a>
    </div>
</section><!-- /hero section/ -->

<!-- ## SHORT ABOUT ## -->
<section id="about" class="cont about">
    <h2 data-i18n="about.title"></h2>
    <!-- Grid -->
	<div class="grid-column">
        <!-- C++ -->
        <div class="cont">
            <img src="/media/logo/skills/cpp.png"
                 alt="C++ logo"
                 data-i18n-alt="about.item1.alt" />
            <b data-i18n="about.item1.title"></b>
            <p data-i18n="about.item1.desc"></p>
        </div>
        <!-- Game Mechanics -->
        <div class="cont">
            <img src="/media/index/controller.webp"
                 alt="A controller that represents the game mechanics"
                 data-i18n-alt="about.item2.alt" />
            <b data-i18n="about.item2.title"></b>
            <p data-i18n="about.item2.desc"></p>
        </div>
        <!-- Full-Cycle -->
        <div class="cont">
            <img src="/media/index/circle.png"
                 alt="A circle with 5 arrows that represents the loop of the full-cycle develop"
                 data-i18n-alt="about.item3.alt" />
            <b data-i18n="about.item3.title"></b>
            <p data-i18n="about.item3.desc"></p>
        </div>
    </div><!-- /grid/ -->

    <br><!-- break -->

    <!-- Button: Find More -->
    <a class="btn" href="about.html" target="_blank">
        <span data-i18n="about.find_more"></span>
        <span class="arrow-svg"></span>
    </a>

    <!-- Technologies icons bar -->
    {% include sections/skills.html %}
</section><!-- /about section/ -->

<!-- ## FEATURED PROJECTS ## -->
<section id="projects" class="cont features">
    <!-- Title -->
    <h2 data-i18n="projects.title"></h2>
    <!-- Description -->
    <p data-i18n-html="projects.desc"></p>

    <br><!-- break -->

    <!-- Games -->
    {% include sections/projects/games.html featured=true %}

    <br><!-- break -->

    <!-- Button: All Projects -->
    <a class="btn" href="projects.html">
        <span data-i18n="hero.cta"></span>
        <span class="arrow-svg"></span>
    </a>
</section> <!-- /featured section/ -->

<!-- ## CONTACT ## -->
{% include sections/contact.html %}

<!-- Load `/locales/<lang>/projects/games.json` for the games grid -->
<script> window.extraLocales = [
    'projects/shared/games',
    'shared/contact'
] </script>
