<!-- # HERO SECTION # -->
<section id="hero" class="cont hero">
    <!-- LEFT -->
    <div class="desc">
        <!-- Text: tag, header and presentation -->
        <span class="tag" data-i18n="hero.tag"></span>
        <h1 class="title">Fabio Pittaccio</h1>
        <p data-i18n-html="hero.presentation"></p>

        <br><!-- break -->

        <!-- View Projects Button -->
        <a class="btn big" href="projects.html" target="_blank">
            <span data-i18n="hero.projects"></span>
            <span class="arrow right"></span>
        </a>

        <!-- Quick info -->
        <div class="info-box">
            <div class="info">
                <b>5+</b>
                <span data-i18n="hero.info.published"></span>
            </div>
            <div class="info">
                <b>UE5</b>
                <span data-i18n="hero.info.engine"></span>
            </div>
            <div class="info">
                <b>PC · Android</b>
                <span data-i18n="hero.info.platforms"></span>
            </div>
        </div><!-- /hero-info-box/ -->
    </div><!-- /hero-content/ -->

    <!-- RIGHT (Image) -->
    <img src="/media/profile.jpg" alt="Fabio Pittaccio"
         onclick="openOneImage(this)"

         data-img1="/media/profile.jpg"
         data-desc1="hero.image_desc"
    />

    <!-- INDICATOR -->
    <a href="#about" class="scroll-indicator" aria-label="Scroll to the about section">
        <span class="arrow"></span>
    </a>
</section><!-- /hero section/ -->

<!-- ## SHORT ABOUT ## -->
<section id="about" class="cont about">
    <h2 data-i18n="about.title"></h2>
    <!-- Grid -->
	<div class="grid-column">
        <!-- UE Specialist -->
        <div class="cont">
            <img src="media/index/about/cplusplus.png" alt="C++ logo" />
            <b data-i18n="about.item1.title"></b>
            <p data-i18n="about.item1.desc"></p>
        </div>
        <!-- Cross-Platform -->
        <div class="cont">
            <img src="media/index/about/controller.webp" alt="Android Logo" />
            <b data-i18n="about.item2.title"></b>
            <p data-i18n="about.item2.desc"></p>
        </div>
        <!-- Full-Cycle Dev -->
        <div class="cont">
            <img src="media/index/about/circle.png" alt="Full Cycle - arrows circle" />
            <b data-i18n="about.item3.title"></b>
            <p data-i18n="about.item3.desc"></p>
        </div>
    </div><!-- /grid/ -->

    <br><!-- break -->

    <!-- Button: Find More -->
    <a class="btn" href="about.html" target="_blank">
        <span data-i18n="about.find_more"></span>
        <span class="arrow right"></span>
    </a>

    <!-- Technologies icons bar -->
    {% include sections/skills.html %}
</section><!-- /about section/ -->
