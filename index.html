---
layout: default
title: Home
description: The home page
---

<!-- # HERO SECTION # -->
<section id="hero" class="cont hero">
    <!-- LEFT -->
    <div class="desc">
        <!-- Text: tag, header and presentation -->
        <span class="tag" data-i18n="hero.tag"></span>
        <h1 class="title">Fabio Pittaccio</h1>
        <p data-i18n-html="hero.presentation"></p>

        <br><!-- break -->

        <!-- View Projects Button -->
        <a class="btn big" href="projects.html" target="_blank">
            <span data-i18n="hero.cta"></span>
            <span class="arrow right"></span>
        </a>

        <!-- Quick info -->
        <div class="info-box">
            <div class="info">
                <b>5+</b>
                <span data-i18n="hero.info.published"></span>
            </div>
            <div class="info">
                <b>UE5</b>
                <span data-i18n="hero.info.engine"></span>
            </div>
            <div class="info">
                <b>PC · Android</b>
                <span data-i18n="hero.info.platforms"></span>
            </div>
        </div><!-- /hero-info-box/ -->
    </div><!-- /hero-content/ -->

    <!-- RIGHT (Image) -->
    <img src="/media/profile.jpg" alt="Fabio Pittaccio"
         onclick="openOneImage(this)"

         data-img1="/media/profile.jpg"
         data-desc1="hero.image_desc"
    />

    <!-- INDICATOR -->
    <a class="scroll-indicator" href="#about" aria-label="Scroll to the about section">
        <span class="arrow"></span>
    </a>
</section><!-- /hero section/ -->

<!-- ## SHORT ABOUT ## -->
<section id="about" class="cont about">
    <h2 data-i18n="about.title"></h2>
    <!-- Grid -->
	<div class="grid-column">
        <!-- C++ -->
        <div class="cont">
            <img src="media/index/about/cplusplus.png" alt="C++ logo" />
            <b data-i18n="about.item1.title"></b>
            <p data-i18n="about.item1.desc"></p>
        </div>
        <!-- Game Mechanics -->
        <div class="cont">
            <img src="media/index/about/controller.webp" alt="Android Logo" />
            <b data-i18n="about.item2.title"></b>
            <p data-i18n="about.item2.desc"></p>
        </div>
        <!-- Full-Cycle -->
        <div class="cont">
            <img src="media/index/about/circle.png" alt="Full Cycle - arrows circle" />
            <b data-i18n="about.item3.title"></b>
            <p data-i18n="about.item3.desc"></p>
        </div>
    </div><!-- /grid/ -->

    <br><!-- break -->

    <!-- Button: Find More -->
    <a class="btn" href="about.html" target="_blank">
        <span data-i18n="about.find_more"></span>
        <span class="arrow right"></span>
    </a>

    <!-- Technologies icons bar -->
    {% include sections/skills.html %}
</section><!-- /about section/ -->

<!-- ## FEATURED PROJECTS ## -->
<section id="projects" class="cont features">
    <!-- Title -->
    <h2 data-i18n="projects.title"></h2>
    <!-- Description -->
    <p data-i18n="projects.desc"></p>

    <br><!-- break -->

    <!-- GRID -->
    <div class="grid-column">

        <!-- ## Ruins' Rhapsody ## -->
        <div class="card">
            <!-- Title link -->
            <a href="projects/ruins-rhapsody.html" target="_blank"><b data-i18n="projects.ruins.name"></b></a>
            <!-- Image -->
            <img src="media/games/ruins-rhapsody/banner.jpg" alt="Ruins' Rhapsody Banner" onclick="openPopup(this)"/>
            <!-- Description -->
            <p class="project-desc" data-i18n-html="projects.ruins.desc"></p>
            <!-- Buttons -->
            <div class="flexbox">
                <!-- itch -->
                <a class="btn full left" href="https://pittabio.itch.io/ruins-rhapsody-demo" target="_blank">
                    <span data-i18n="projects.link1"></span>
                    <span class="itch-svg"></span>
                </a>
                <!-- details -->
                <a class="btn full right" href="projects/ruins-rhapsody.html" target="_blank">
                    <span data-i18n="projects.link2"></span>
                    <span class="arrow right"></span>
                </a>
            </div><!-- /buttons/ -->
        </div><!-- /card/ -->

        <!-- ## Goblin Jr. Adventure ## -->
        <div class="card">
            <!-- Title link -->
            <a href="projects/goblin-jr.html" target="_blank"><b data-i18n="projects.goblin.name"></b></a>
            <!-- Image -->
            <img src="media/games/goblin-jr/banner.png" alt="Goblin Jr. Adventure Banner" onclick="openPopup(this)"/>
            <!-- Description -->
            <p class="project-desc" data-i18n-html="projects.goblin.desc"></p>
            <!-- Buttons -->
            <div class="flexbox">
                <!-- itch -->
                <a class="btn full left" href="https://pittabio.itch.io/goblin-jr-adventure" target="_blank">
                    <span data-i18n="projects.link1"></span>
                    <span class="itch-svg"></span>
                </a>
                <!-- details -->
                <a class="btn full right" href="projects/goblin-jr.html" target="_blank">
                    <span data-i18n="projects.link2"></span>
                    <span class="arrow right"></span>
                </a>
            </div><!-- /buttons/ -->
        </div><!-- /card/ -->

        <!-- ## Zombie Siege Chronicles ## -->
        <div class="card">
            <!-- Title link -->
            <a href="projects/zombie-siege.html" target="_blank"><b data-i18n="projects.zombie.name"></b></a>
            <!-- Image -->
            <img src="media/games/zombie-siege/banner.png" alt="Zombie Siege Chronicles Banner" onclick="openPopup(this)"/>
            <!-- Description -->
            <p class="project-desc" data-i18n-html="projects.zombie.desc"></p>
            <!-- Buttons -->
            <div class="flexbox">
                <!-- details -->
                <a class="btn full left" href="https://fabriziop.itch.io/zombie-siege-chronicles" target="_blank">
                    <span data-i18n="projects.link1"></span>
                    <span class="itch-svg"></span>
                </a>
                <!-- itch -->
                <a class="btn full right" href="projects/zombie-siege.html">
                    <span data-i18n="projects.link2"></span>
                    <span class="arrow right"></span>
                </a>
            </div><!-- /buttons/ -->
        </div><!-- /card/ -->
    </div><!-- /grid/ -->

    <br><!-- break -->

    <!-- Button: All Projects -->
    <a class="btn" href="projects.html">
        <span data-i18n="hero.cta"></span>
        <span class="arrow right"></span>
    </a>
</section> <!-- /featured section/ -->

<!-- ## CONTACT ## -->
