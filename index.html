<!-- # HERO SECTION # -->
<section class="hero-section" id="hero">
    <div class="hero-container">
        <!-- LEFT -->
        <div class="hero-content">
            <!-- Text: tag, header and presentation -->
            <span class="hero-tag" data-i18n="hero.tag"></span>
            <h1 class="hero-title">Fabio Pittaccio</h1>
            <p data-i18n-html="hero.presentation"></p>
            <br>

            <!-- View Projects Button -->
            <a class="btn big" href="#">
                <span data-i18n="hero.projects"></span>
                <span class="arrow right"></span>
            </a>

            <!-- Quick info -->
            <div class="hero-info-box">
                <div class="hero-info">
                    <b>5+</b>
                    <span data-i18n="hero.info.published"></span>
                </div>
                <div class="hero-info">
                    <b>UE5</b>
                    <span data-i18n="hero.info.engine"></span>
                </div>
                <div class="hero-info">
                    <b>PC · Android</b>
                    <span data-i18n="hero.info.platforms"></span>
                </div>
            </div><!-- /hero-info-box/ -->
        </div><!-- /hero-content/ -->

        <!-- RIGHT (Image) -->
        <img src="/media/profile.jpg" alt="Fabio Pittaccio"
             onclick="openOneImage(this)"

             data-img1="/media/profile.jpg"
             data-desc1="hero.image_desc"
        />

        <!-- INDICATOR -->
        <a href="#about" class="scroll-indicator" aria-label="Scroll to the about section">
            <span class="arrow"></span>
        </a>
    </div><!-- /hero-container/ -->
</section><!-- /hero-section/ -->

            <div class="about-icon">🚀</div>

            <p data-i18n="about.item1.desc"></p>
        </div>
        <!-- Cross-Platform -->
        <div class="about-item">
            <div class="about-icon">📱</div>
            <h3 data-i18n="about.item2.title"></h3>
            <p data-i18n="about.item2.desc"></p>
        </div>

        <div class="about-item">
            <div class="about-icon">🛠️</div>
            <h3 data-i18n="about.item3.title"></h3>
            <p data-i18n="about.item3.desc"></p>
        </div>
    </div><!-- /grid/ -->

    <!-- Button: Find More -->
    <a class="btn" href="about.html" style="align-self: center;">
        <span data-i18n="about.find_more"></span>
        <!-- svg arrow -->
